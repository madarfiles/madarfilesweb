[build]
  command = "npm run build:netlify"
  publish = "netlify-public"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "24"
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["ws", "@netlify/identity"]
[[redirects]]
  from = "/licenses"
  to = "/licenses.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

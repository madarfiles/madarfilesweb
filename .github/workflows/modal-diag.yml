name: Fast lane check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -q modal==1.6.4 && (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg) >/dev/null
      - name: Token
        run: |
          ALL="$RAW_ID $RAW_SECRET"
          ID=$(printf '%s' "$ALL" | grep -oE 'ak-[A-Za-z0-9]+' | head -1 || true)
          SECRET=$(printf '%s' "$ALL" | grep -oE 'as-[A-Za-z0-9]+' | head -1 || true)
          echo "::add-mask::$ID"; echo "::add-mask::$SECRET"
          echo "MODAL_TOKEN_ID=$ID" >> $GITHUB_ENV; echo "MODAL_TOKEN_SECRET=$SECRET" >> $GITHUB_ENV
        env:
          RAW_ID: ${{ secrets.MODAL_TOKEN_ID }}
          RAW_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      - name: Recent logs
        run: |
          modal app list || true
          modal container list || true
          timeout 45 modal app logs madar-fast 2>&1 | tail -300 || true
      - name: End to end (two runs in a row)
        run: |
          ffmpeg -v error -f lavfi -i "sine=f=220:d=75" -f lavfi -i "anoisesrc=d=75:a=0.05" -filter_complex amix=inputs=2 -c:a aac -b:a 128k test.m4a
          ls -l test.m4a
          for n in fast precise; do
            T=$(curl -sS -X POST https://madarfiles.netlify.app/api/fast/ticket -H 'Origin: https://madarfiles.netlify.app' -H 'Content-Type: application/json' -d '{"tool":"separate"}')
            echo "ticket reply: $(echo "$T" | sed 's/"ticket":"[a-f0-9]*"/"ticket":"…"/')"
            TK=$(echo "$T" | python -c 'import sys,json;print(json.load(sys.stdin).get("ticket",""))')
            [ -z "$TK" ] && exit 1
            S=$(date +%s)
            ID=$(curl -sS -X POST https://madarfiles-app--madar-fast.modal.run/submit -H "X-Madar-Ticket: $TK" -H 'X-Madar-Ext: m4a' -H 'X-Madar-Out: m4a' -H "X-Madar-Model: $n" -H 'Origin: https://madarfiles.netlify.app' --data-binary @test.m4a)
            echo "submit: $ID"
            CID=$(echo "$ID" | python -c 'import sys,json;print(json.load(sys.stdin).get("id",""))')
            for i in $(seq 1 120); do
              sleep 3
              CODE=$(curl -sS -o out.bin -w '%{http_code} %{content_type}' "https://madarfiles-app--madar-fast.modal.run/result/$CID?out=m4a")
              case "$CODE" in *json*) [ $((i%5)) -eq 0 ] && echo "$((`date +%s`-S))s $CODE $(head -c 200 out.bin)";; *) echo "run $n done in $((`date +%s`-S))s: $CODE $(stat -c%s out.bin) bytes"; break;; esac
              case "$CODE" in 500*) cat out.bin; break;; esac
            done
          done
      - name: Logs after test
        if: always()
        run: timeout 30 modal app logs madar-fast 2>&1 | tail -200 || true

name: Strong model benchmark
on: workflow_dispatch
permissions: {contents: read}
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -q modal==1.6.4 && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Run
        run: |
          ALL="$RAW_ID $RAW_SECRET"
          export MODAL_TOKEN_ID=$(printf '%s' "$ALL" | grep -oE 'ak-[A-Za-z0-9]+' | head -1)
          export MODAL_TOKEN_SECRET=$(printf '%s' "$ALL" | grep -oE 'as-[A-Za-z0-9]+' | head -1)
          echo "::add-mask::$MODAL_TOKEN_ID"; echo "::add-mask::$MODAL_TOKEN_SECRET"
          ffmpeg -v error -f lavfi -i "sine=f=220:d=300" -f lavfi -i "sine=f=330:d=300" -f lavfi -i "anoisesrc=d=300:a=0.05" -filter_complex amix=inputs=3 -ac 2 -c:a aac -b:a 128k test.m4a
          modal run scripts/modal_bench.py --path test.m4a
        env:
          RAW_ID: ${{ secrets.MODAL_TOKEN_ID }}
          RAW_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

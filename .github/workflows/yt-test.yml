name: YouTube download check
on: workflow_dispatch
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: python3 -m pip install -q -U "yt-dlp[default]" bgutil-ytdlp-pot-provider
      - name: Release info
        run: |
          curl -s https://api.github.com/repos/Brainicism/bgutil-ytdlp-pot-provider/releases/latest | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["tag_name"],[a["name"] for a in d["assets"]])'
          curl -s https://api.github.com/repos/jim60105/bgutil-ytdlp-pot-provider-rs/releases/latest | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["tag_name"],[a["name"] for a in d["assets"]])'
          yt-dlp --version; pip show bgutil-ytdlp-pot-provider | head -2
      - name: Without provider
        continue-on-error: true
        run: yt-dlp -v --js-runtimes node -f "b[height<=360]" -o a.mp4 https://www.youtube.com/watch?v=jNQXAC9IVRw 2>&1 | tail -25
      - name: Start provider (prebuilt binary)
        continue-on-error: true
        run: |
          curl -sL -o pot https://github.com/jim60105/bgutil-ytdlp-pot-provider-rs/releases/latest/download/bgutil-pot-linux-x86_64 && chmod +x pot && file pot
          (./pot server --port 4416 > pot.log 2>&1 &) ; sleep 5; curl -s http://127.0.0.1:4416/ping; echo; tail -5 pot.log
      - name: With provider
        continue-on-error: true
        run: yt-dlp -v --js-runtimes node -f "b[height<=360]" -o b.mp4 https://www.youtube.com/watch?v=jNQXAC9IVRw 2>&1 | grep -i "pot\|error\|bot\|Destination\|100%" | tail -25; ls -la *.mp4 || true

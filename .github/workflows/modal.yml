name: Deploy the fast lane to Modal
on:
  push:
    branches: [main]
    paths: ['modal/**', '.github/workflows/modal.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency: modal-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -q modal==1.6.4
      - name: Deploy
        run: modal deploy modal/madar_fast.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 60 https://madarfiles-app--madar-fast.modal.run/health; then echo; echo "FAST LANE OK"; exit 0; fi
            sleep 10
          done
          echo "Health check failed: the endpoint URL may differ, see the Deploy step output"; exit 1

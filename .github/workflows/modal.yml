name: Deploy the fast lane to Modal
on:
  push:
    branches: [main]
    paths: ['modal/**', '.github/workflows/modal.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency: modal-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -q modal==1.6.4
      - name: Deploy
        # Accepts the token however it was pasted (alone, with labels, the whole
        # "modal token set ..." line, or the two swapped): only ak-/as- parts are used.
        run: |
          ALL="$RAW_ID $RAW_SECRET"
          ID=$(printf '%s' "$ALL" | grep -oE 'ak-[A-Za-z0-9]+' | head -1 || true)
          SECRET=$(printf '%s' "$ALL" | grep -oE 'as-[A-Za-z0-9]+' | head -1 || true)
          [ -n "$ID" ] && echo "::add-mask::$ID"
          [ -n "$SECRET" ] && echo "::add-mask::$SECRET"
          if [ -z "$ID" ]; then echo "لم أجد قيمة تبدأ بـ ak- في المفتاحين (MODAL_TOKEN_ID)"; exit 1; fi
          if [ -z "$SECRET" ]; then echo "لم أجد قيمة تبدأ بـ as- في المفتاحين (MODAL_TOKEN_SECRET)"; exit 1; fi
          echo "token id length ${#ID}, secret length ${#SECRET}"
          MODAL_TOKEN_ID="$ID" MODAL_TOKEN_SECRET="$SECRET" modal deploy modal/madar_fast.py
        env:
          RAW_ID: ${{ secrets.MODAL_TOKEN_ID }}
          RAW_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 60 https://madarfiles-app--madar-fast.modal.run/health; then echo; echo "FAST LANE OK"; exit 0; fi
            sleep 10
          done
          echo "Health check failed: the endpoint URL may differ, see the Deploy step output"; exit 1

name: Build and test Madar Web 0.21
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci --ignore-scripts && node node_modules/esbuild/install.js
      - run: npm run build:netlify
      - run: node --test --test-concurrency=1 tests/*.test.mjs
      - run: python -m unittest discover -s tests -p 'test_*.py'
